[project]
name = "workshop-ml"
version = "1.0.0"
description = "Workshop d'introduction au Machine Learning (PMI IPSA x Augura Space)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    # torch < 2.10 : les versions suivantes exigent macOS 14 sur Apple Silicon
    # Mac Intel : PyTorch ne publie plus de wheels après 2.2.2, qui exige numpy<2
    "torch>=2.5,<2.10 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=1.26,<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
# Uniquement pour régénérer les données : uv run --group data python data/fetch_omni.py
data = ["cdasws>=1.8", "cdflib>=1.3", "xarray>=2024.1"]

[tool.uv]
package = false
# Mac Intel : argon2-cffi-bindings (dépendance de Jupyter) n'a plus de wheel x86_64 à partir de 26.x
constraint-dependencies = [
    "argon2-cffi-bindings<26 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

# Sous Linux, le torch par défaut embarque CUDA (plusieurs Go) : on force la version CPU
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
