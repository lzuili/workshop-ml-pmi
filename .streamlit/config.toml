[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f2ef"
textColor = "#0b0b0b"
# Lisible sur vidéoprojecteur
baseFontSize = 18

[browser]
# Aucune requête réseau sortante : l'app doit tourner hors ligne
gatherUsageStats = false

[server]
headless = false
